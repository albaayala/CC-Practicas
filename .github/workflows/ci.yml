name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: solo leer el repositorio
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install "$(grep -i '^ruff==' services/login/requirements-dev.txt)"

      - name: Ruff (código)
        run: ruff check services

      - name: Ruff (formato)
        run: ruff format --check services

      - name: Hadolint (Dockerfiles)
        run: |
          for servicio in login tareas estadisticas; do
            docker run --rm -i hadolint/hadolint < services/$servicio/Dockerfile
          done

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [login, tareas, estadisticas]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.servicio }}/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: pytest -v
  
  docker:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # En esre caso si necesita esctibir
    strategy:
      fail-fast: false
      matrix:
        servicio: [login, tareas, estadisticas]
    steps:
      - uses: actions/checkout@v7

      # GHCR exige nombres en minúsculas, asi que se pasan los nombres del repo a minuscula
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.servicio }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # Solo se inicia sesión cuando se va a publicar
      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.servicio }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}