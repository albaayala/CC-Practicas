name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permisos mínimos: solo leer el repositorio
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # La versión de ruff sale de requirements-dev.txt: una sola fuente de verdad
      - name: Instalar ruff
        run: pip install "$(grep -i '^ruff==' services/login/requirements-dev.txt)"

      - name: Ruff (código)
        run: ruff check services

      - name: Ruff (formato)
        run: ruff format --check services

      - name: Hadolint (Dockerfiles)
        run: |
          for servicio in login tareas estadisticas; do
            docker run --rm -i hadolint/hadolint < services/$servicio/Dockerfile
          done

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [login, tareas, estadisticas]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.servicio }}
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.servicio }}/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: pytest -v